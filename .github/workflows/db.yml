name: Database

# The expensive lane. Boots a real local Supabase stack, replays EVERY
# migration from scratch, then runs pgTAP against the result.
#
# Path-filtered on purpose: booting the stack costs a few minutes, and a PR
# that only touches React components cannot break a migration replay. Most PRs
# never trigger this job.
#
# What it would have caught, had it existed on 2026-08-05:
#   - migration 073 silently reverting 049/050/051's username guards (a fresh
#     replay ends with the guards missing — the deployed body looked fine)
#   - pgTAP 004 test 2 sitting red for weeks
#   - a migration that only applies cleanly on top of a drifted database
#
# THE STACK-LANE GLOBS ARE NOT SCOPE CREEP (2026-08-26, F94/F70): the
# "Database-backed tests" step below RUNS files that live in `src/`, and this
# trigger did not watch a single one of them. A PR that edited a stack suite
# got no database run at all, and the alarm that finally rang rang on someone
# else's migration. The globs connect the job to the files it executes; the
# broad `src/**` is still deliberately excluded, so a React-only PR remains
# outside the expensive lane exactly as before.
#
# The two `src/`-facing patterns below are `vitest.shared.ts`'s `stackInclude`
# VERBATIM — that array is the definition of what this step runs, so this
# filter mirrors it rather than paraphrasing it. The first cut paraphrased
# and got it wrong in both directions at once (R608): it watched
# `src/lib/leagues/gate/**`, which holds only the M0 gate this job never
# runs, and therefore left `src/lib/leagues/m1-gate/m1-phase-a-journey.test.ts`
# — one of the 31 files it DOES run — unwatched. `ci-stack-lane-trigger.test.ts`
# now pins the mirror in both directions and runs in the fast lane, so the
# two lists cannot drift apart again without a red.

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/db.yml'
      # stackInclude, verbatim — see ci-stack-lane-trigger.test.ts
      - '**/*-db.test.ts'
      - 'src/lib/leagues/m1-gate/**/*.test.ts'
      - 'vitest.shared.ts'
      - 'vitest.config.ts'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/db.yml'
      # stackInclude, verbatim — see ci-stack-lane-trigger.test.ts
      - '**/*-db.test.ts'
      - 'src/lib/leagues/m1-gate/**/*.test.ts'
      - 'vitest.shared.ts'
      - 'vitest.config.ts'

concurrency:
  group: db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: migration replay · pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Boots Postgres and applies supabase/migrations in order from nothing.
      # This is the check: production drift cannot hide a migration that only
      # works on top of an already-drifted database.
      - name: Start Supabase (replays all migrations from scratch)
        run: supabase start

      - name: pgTAP
        run: supabase test db

      # The vitest suites that talk to a real database. They cannot run in the
      # fast lane, and this job already has the stack up.
      - name: Database-backed tests
        if: ${{ !cancelled() }}
        run: npm run test:stack

      - name: Migration hygiene
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cd supabase/migrations

          # Every migration is NNN_name.sql. A stray name is what produced the
          # two auto-versioned history rows that had to be relabelled by hand.
          bad=$(ls | grep -vE '^[0-9]{3}_[a-z0-9_]+\.sql$' | grep -v '^\.gitkeep$' || true)
          if [ -n "$bad" ]; then
            echo "::error::migration filenames must be NNN_snake_case.sql:"
            echo "$bad"
            exit 1
          fi

          # No two migrations may claim the same number — duplicates apply in
          # an undefined order and one silently wins.
          dupes=$(ls | grep -E '^[0-9]{3}_' | cut -c1-3 | sort | uniq -d || true)
          if [ -n "$dupes" ]; then
            echo "::error::duplicate migration numbers: $dupes"
            exit 1
          fi

          echo "migration filenames and numbering OK"
