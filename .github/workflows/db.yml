name: Database

# The expensive lane. Boots a real local Supabase stack, replays EVERY
# migration from scratch, then runs pgTAP against the result.
#
# Path-filtered on purpose: booting the stack costs a few minutes, and a PR
# that only touches React components cannot break a migration replay. Most PRs
# never trigger this job.
#
# What it would have caught, had it existed on 2026-08-05:
#   - migration 073 silently reverting 049/050/051's username guards (a fresh
#     replay ends with the guards missing — the deployed body looked fine)
#   - pgTAP 004 test 2 sitting red for weeks
#   - a migration that only applies cleanly on top of a drifted database
#
# THE STACK-LANE GLOBS ARE NOT SCOPE CREEP (2026-08-26, F94/F70): the
# "Database-backed tests" step below RUNS files that live in `src/`, and this
# trigger did not watch a single one of them. A PR that edited a stack suite
# got no database run at all, and the alarm that finally rang rang on someone
# else's migration. The globs connect the job to the files it executes; the
# broad `src/**` is still deliberately excluded, so a React-only PR remains
# outside the expensive lane exactly as before.
#
# The two `src/`-facing patterns below are `vitest.shared.ts`'s `stackInclude`
# VERBATIM — that array is the definition of what this step runs, so this
# filter mirrors it rather than paraphrasing it. The first cut paraphrased
# and got it wrong in both directions at once (R608): it watched
# `src/lib/leagues/gate/**`, which holds only the M0 gate this job never
# runs, and therefore left `src/lib/leagues/m1-gate/m1-phase-a-journey.test.ts`
# — one of the 31 files it DOES run — unwatched. `ci-stack-lane-trigger.test.ts`
# now pins the mirror in both directions and runs in the fast lane, so the
# two lists cannot drift apart again without a red.
#
# THE THIRD DIRECTION — THE SOURCE THOSE SUITES IMPORT (2026-09-08, F290):
# mirroring `stackInclude` connected this job to the FILES IT RUNS, but not to
# the modules those files IMPORT, and a source-only change walked straight
# past. MEASURED on PR #274: `season-sweep-db.test.ts` imports
# `./season-runner`; #274 changed `season-runner.ts`, `season-scenario.ts` and
# `sim-types.ts` and touched no `*-db.test.ts`, so `gh run list --branch
# fix/M4-F286-sim-full-slate` shows only the `CI` workflow — this job never
# fired. (PR #273 was masked because it CREATED that suite file; every sim PR
# after it was exposed.) The `src/`-facing source block below is therefore the
# measured TRANSITIVE IMPORT CLOSURE of the stack suites, not a guess — which
# is why it reaches strays outside `src/lib/leagues/**`: `src/lib/sports-data`
# (via `sync/projections.ts`), `src/types/database.ts` (via `stat-keys.ts`),
# `src/utils` (via `commish-auction-ops.ts`), and three pure-logic helpers that
# happen to live under `src/components/draft/`.
#
# The broad `src/**` is STILL deliberately excluded, for the unchanged reason:
# a React-only PR cannot break a migration replay and must stay out of the
# expensive lane. Those three `src/components/draft` modules are named FILE BY
# FILE rather than by directory glob for exactly that reason — that directory
# holds 26 React components and 36 unit-test files beside them, and watching
# the lot would be the R608 shape again (a pattern that looks like coverage
# while most of what it matches this job never runs). Naming files is not
# brittle here: `ci-stack-lane-trigger.test.ts` walks the closure and REDS in
# the fast lane the moment a fourth becomes reachable.
#
# THE COST, ACCEPTED KNOWINGLY: every `src/lib/leagues/**` PR now boots the
# stack, which is most league PRs. It is affordable because F264's flake class
# was root-caused in PR #271 (D325) and every `Database` run since has been
# green on the first attempt. If that stops being true, fix the flake — do not
# narrow this filter back to a list that cannot see its own inputs.
#
# THE CLI IS THE REPO'S OWN PINNED `supabase` DEVDEPENDENCY, RUN VIA `npx`
# (2026-09-08, F280 / D325): `supabase/setup-cli@v1` with `version: latest`
# resolved "latest" through the unauthenticated GitHub API and rate-limited
# on shared runners ("Failed to resolve latest Supabase CLI release: rate
# limit exceeded" — `main` runs 34011826441 and 34165252649), after which
# the `!cancelled()` gate below ran 47 stack files against a stack that had
# never started (ECONNREFUSED 127.0.0.1:54321 × 47 — a red that named the
# wrong cause). `npm ci` already installs the exact CLI local development
# uses (`package.json` → `supabase`), so the job now runs that one: no API
# call, no version drift between CI and `npx supabase db reset` locally.
# The stack-backed step runs only if the stack STARTED (pgTAP may still red
# it), so a stack that never came up reds ONE step with its own message.
#
# ...WHICH IS WHY `package.json` AND `package-lock.json` ARE IN THE FILTER
# (2026-09-08, R934). The four lines above declare the pinned devDependency an
# INPUT to this replay, and nothing watched it: a CLI bump is a manifest-and-
# lockfile-only diff (`a7a76c3`, "exact-pin supabase CLI", is exactly that file
# set) matching neither block, so it would merge with this job never running
# and the red would land on the next unrelated `supabase/**` PR — verbatim the
# F94 shape this banner already records one act up. `package.json` is a lane-
# DEFINITION file besides: `test:stack` ("vitest run 'db.test' 'm1-gate'") is
# the third list describing what this step runs, beside `stackInclude` and the
# filter below. The cost is knowingly taken: every dependency bump now boots
# the stack. That is the correct direction — a bump is precisely the change
# that can break a replay without touching a line of our own code.

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/db.yml'
      # stackInclude, verbatim — see ci-stack-lane-trigger.test.ts
      - '**/*-db.test.ts'
      - 'src/lib/leagues/m1-gate/**/*.test.ts'
      - 'vitest.shared.ts'
      - 'vitest.config.ts'
      # the pinned CLI this replay RUNS, and `test:stack` itself (R934)
      - 'package.json'
      - 'package-lock.json'
      # the SOURCE those suites import — the measured transitive closure
      # (F290). NOT `src/**`: see the banner.
      - 'src/lib/leagues/**'
      - 'src/lib/sync/**'
      - 'src/lib/supabase/**'
      - 'src/lib/lists/**'
      - 'src/lib/sports-data/**'
      - 'src/lib/email/**'
      - 'src/lib/nfl-teams.ts'
      - 'src/utils/**'
      - 'src/types/database.ts'
      - 'src/components/draft/auction-budget.ts'
      - 'src/components/draft/commish-auction-ops.ts'
      - 'src/components/draft/draft-order.ts'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/db.yml'
      # stackInclude, verbatim — see ci-stack-lane-trigger.test.ts
      - '**/*-db.test.ts'
      - 'src/lib/leagues/m1-gate/**/*.test.ts'
      - 'vitest.shared.ts'
      - 'vitest.config.ts'
      # the pinned CLI this replay RUNS, and `test:stack` itself (R934)
      - 'package.json'
      - 'package-lock.json'
      # the SOURCE those suites import — the measured transitive closure
      # (F290). NOT `src/**`: see the banner.
      - 'src/lib/leagues/**'
      - 'src/lib/sync/**'
      - 'src/lib/supabase/**'
      - 'src/lib/lists/**'
      - 'src/lib/sports-data/**'
      - 'src/lib/email/**'
      - 'src/lib/nfl-teams.ts'
      - 'src/utils/**'
      - 'src/types/database.ts'
      - 'src/components/draft/auction-budget.ts'
      - 'src/components/draft/commish-auction-ops.ts'
      - 'src/components/draft/draft-order.ts'

concurrency:
  group: db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: migration replay · pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The CLI is the pinned devDependency `npm ci` just installed — see the
      # banner (F280): no `setup-cli`, no GitHub API call, no "latest".
      - run: npx supabase --version

      # Boots Postgres and applies supabase/migrations in order from nothing.
      # This is the check: production drift cannot hide a migration that only
      # works on top of an already-drifted database.
      - name: Start Supabase (replays all migrations from scratch)
        id: start
        run: npx supabase start

      - name: pgTAP
        run: npx supabase test db

      # The vitest suites that talk to a real database. They cannot run in the
      # fast lane, and this job already has the stack up. Runs after a pgTAP
      # red (every problem in one pass) but NOT after a stack that never
      # started — 47 ECONNREFUSED files would only hide the real cause (F280).
      - name: Database-backed tests
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: npm run test:stack

      - name: Migration hygiene
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cd supabase/migrations

          # Every migration is NNN_name.sql. A stray name is what produced the
          # two auto-versioned history rows that had to be relabelled by hand.
          bad=$(ls | grep -vE '^[0-9]{3}_[a-z0-9_]+\.sql$' | grep -v '^\.gitkeep$' || true)
          if [ -n "$bad" ]; then
            echo "::error::migration filenames must be NNN_snake_case.sql:"
            echo "$bad"
            exit 1
          fi

          # No two migrations may claim the same number — duplicates apply in
          # an undefined order and one silently wins.
          dupes=$(ls | grep -E '^[0-9]{3}_' | cut -c1-3 | sort | uniq -d || true)
          if [ -n "$dupes" ]; then
            echo "::error::duplicate migration numbers: $dupes"
            exit 1
          fi

          echo "migration filenames and numbering OK"
