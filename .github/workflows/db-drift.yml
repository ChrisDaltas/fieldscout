name: Production drift check

# Compares production's applied migration history against the repo.
#
# Drift is invisible until something breaks. On 2026-08-05 production was
# missing THIRTY-SIX migrations and carried two hand-applied rows with
# auto-generated version numbers — discovered only because a signup broke and
# someone went looking. This job makes that state loud within a day.
#
# Migrations may be DECLARED as deliberately held back, in
# supabase/HELD-FROM-PRODUCTION.txt. Holds are closed ranges, so a new
# migration falls outside every hold by default and still reds this check — the
# alarm keeps working while the leagues schema waits for its cohort. A hold that
# is already applied, or that names a migration the repo no longer has, fails too:
# holds expire loudly. Nothing suppresses a STRAY.
#
# Read-only. Reads the applied list over HTTPS via
# public.applied_migration_versions() (migration 078) rather than a direct
# Postgres connection: that would need the database password and the
# region-specific pooler hostname, and the service-role key is one string from
# the same dashboard page as the keys already in Vercel.

on:
  schedule:
    - cron: '0 14 * * *'   # 14:00 UTC daily
  workflow_dispatch:        # and on demand
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'   # a merged migration should reach prod promptly
      # R652 — the job's OWN inputs, or the intended hold-expiry edit ("we pushed
      # 082-104, delete the holds") touches only the declaration file and no run
      # fires until the next 14:00 schedule. This is the R608 shape: a filter that
      # stopped matching the files the job depends on. Pinned by
      # src/lib/ci-drift-holds.test.ts.
      - 'supabase/HELD-FROM-PRODUCTION.txt'
      - '.github/scripts/drift_compare.py'
      - '.github/workflows/db-drift.yml'

jobs:
  drift:
    name: repo vs production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for the secret
        id: secret
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::Drift check skipped — set the repository secret \
          SUPABASE_SERVICE_ROLE_KEY (Settings → Secrets and variables → Actions)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare
        if: steps.secret.outputs.configured == 'true'
        env:
          # Not a secret: this URL ships in the browser bundle. Hardcoding it
          # halves the setup — only the service-role key needs protecting.
          URL: https://xhqrdzllcsrvbbcygilv.supabase.co
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          response=$(curl -sS --fail-with-body --max-time 30 \
            -X POST "${URL%/}/rest/v1/rpc/applied_migration_versions" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "$response" \
            | python3 -c 'import json,sys; [print(r["version"]) for r in json.load(sys.stdin)]' \
            | sort > /tmp/remote.txt

          ls supabase/migrations/*.sql \
            | xargs -n1 basename \
            | grep -E '^[0-9]{3}_' \
            | cut -c1-3 | sort > /tmp/local.txt

          python3 .github/scripts/drift_compare.py \
            /tmp/local.txt /tmp/remote.txt supabase/HELD-FROM-PRODUCTION.txt
